# yaml-language-server: $schema=https://json.schemastore.org/taskfile.json
---
version: "3"

tasks:
  default:
    desc: Show help
    aliases: [h]
    silent: true
    cmds:
      - task -l --sort alphanumeric

  clean:
    cmds:
      - rm -rf bin && mkdir bin
      - rm -rf grpc && mkdir grpc

  install:
    desc: install dependencies
    aliases: [i]
    cmds:
      - go mod tidy

  run:
    desc: run server instance
    aliases: [dev, r, server]
    cmds:
      - task: build-server
      - ./bin/server

  format:
    desc: format
    cmds:
      - gofmt -s -w .

  lint:
    desc: lint
    cmds:
      - golangci-lint run ./...

  scan:
    desc: security scan
    cmds:
      - govulncheck ./...
      - gosec ./...

  check:
    desc: run checks
    aliases: [c]
    cmds:
      - task: grpc:generate
      - task: format
      - task: lint
      # - task: scan

  build-cli:
    desc: build cli
    cmds:
      - GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o bin/cli ./cli

  build-server:
    desc: build server
    run: once
    cmds:
      - task: grpc:generate
      - GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o bin/server ./server

  build:
    desc: build binaries
    aliases: [b]
    run: once
    cmds:
      - task: build-cli
      - task: build-server

  docker:up:
    desc: start docker compose
    aliases: [du]
    interactive: true
    cmds:
      - docker compose up -d

  docker:stop:
    desc: stop docker compose
    aliases: [ds]
    interactive: true
    cmds:
      - docker compose stop -t 0

  docker:restart:
    desc: restart docker
    aliases: [dr]
    interactive: true
    cmds:
      - task: docker:stop
      - task: docker:up

  grpc:generate:
    aliases: [gg]
    run: once
    sources:
      - "proto/*.proto"
    cmds:
      - rm -f grpc/*.pb.go
      - >-
        protoc
        --go_out=. --go_opt=paths=source_relative
        --go-grpc_out=. --go-grpc_opt=paths=source_relative
        --proto_path=.
        proto/shop.proto
      - mv proto/*.pb.go grpc/
